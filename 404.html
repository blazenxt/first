<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>
</head>
<body>
    <main>
        <section class="container text-center py-40">
            <h1 class="text-9xl font-extrabold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-pink-500 animate-pulse">404</h1>
            <h2 class="text-3xl font-bold mb-4">Under Construction or Not Found</h2>
            <p class="text-lg text-gray-400 max-w-md mx-auto mb-8">
                The requested resource could not be found, or our dynamic SPA routing table is building its reference.
            </p>
            <a href="#" class="btn btn-primary px-8 py-3.5 rounded-lg text-white font-semibold transition">Back to Safety</a>
        </section>
    </main>
</body>
</html>
